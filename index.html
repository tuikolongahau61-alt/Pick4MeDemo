<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <meta name="theme-color" content="#0a8c8c" />
  <meta name="description" content="Maguro Demo Spot — scan, take a quick quiz, get a dish picked for you." />
  <title>Maguro Demo Spot</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="app">

    <!-- =================================================================
         SCREEN: LANDING
         ================================================================= -->
    <section id="screen-landing" class="screen landing is-active">
      <div class="landing-inner">
        <div class="logo-badge">🌴</div>
        <h1 id="restaurant-name">Maguro Demo Spot</h1>
        <p id="restaurant-tagline" class="tagline"></p>
        <p id="restaurant-blurb" class="blurb"></p>

        <div class="landing-actions">
          <button id="btn-pick" class="btn btn--primary btn--lg">🍤 Pick for me</button>
          <button id="btn-view-menu" class="btn btn--ghost">View full menu</button>
        </div>

        <p class="landing-hint">Takes about 20 seconds</p>
      </div>
    </section>

    <!-- =================================================================
         SCREEN: QUIZ  (one question at a time)
         ================================================================= -->
    <section id="screen-quiz" class="screen quiz">
      <div class="topbar">
        <button id="btn-quiz-back" class="topbar-back">← Back</button>
        <span id="quiz-progress" class="topbar-progress">Question 1 of 5</span>
      </div>
      <div class="quiz-bar"><div id="quiz-bar-fill" class="quiz-bar-fill"></div></div>

      <div id="quiz-body" class="quiz-body"><!-- rendered by script.js --></div>

      <div class="quiz-nav">
        <button id="btn-quiz-next" class="btn btn--primary">Next →</button>
      </div>
    </section>

    <!-- =================================================================
         SCREEN: RESULT
         ================================================================= -->
    <section id="screen-result" class="screen result">
      <div id="result-body" class="result-body"><!-- rendered by script.js --></div>
      <div class="result-actions">
        <button id="btn-result-menu" class="btn btn--secondary">See full menu</button>
        <button id="btn-result-retry" class="btn btn--ghost">↺ Try again</button>
      </div>
    </section>

    <!-- =================================================================
         SCREEN: MENU
         ================================================================= -->
    <section id="screen-menu" class="screen menu">
      <div class="topbar">
        <button id="btn-menu-back" class="topbar-back">← Home</button>
        <button id="btn-menu-pick" class="topbar-action">🍤 Pick for me</button>
      </div>
      <header class="screen-head">
        <h2 class="screen-title">Full menu</h2>
        <p class="screen-sub">Everything we make, fresh to order.</p>
      </header>
      <div id="menu-list"><!-- rendered by script.js --></div>
    </section>

  </main>

  <!-- data first, then logic -->
  <script src="data.js"></script>
  <script src="script.js"></script>
</body>
</html>
