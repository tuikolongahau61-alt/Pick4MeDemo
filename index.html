<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <meta name="theme-color" content="#0a8c8c" />
  <meta name="description" content="Maguro Demo Spot — scan, take a quick quiz, get a dish picked for you." />
  <title>Maguro Demo Spot</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="app">

    <!-- =================================================================
         SECTION: LANDING
         ================================================================= -->
    <section id="section-landing" class="section landing">
      <div class="palm">🌴🍍</div>
      <h1 id="restaurant-name">Maguro Demo Spot</h1>
      <p id="restaurant-tagline">Can't decide what to eat?</p>
      <p id="restaurant-blurb"></p>
      <button id="btn-pick" class="btn btn--primary">Pick for me</button>
      <button id="btn-view-menu" class="btn btn--secondary">View menu</button>
    </section>

    <!-- =================================================================
         SECTION: QUIZ
         ================================================================= -->
    <section id="section-quiz" class="section quiz">
      <header class="section-head">
        <h2 class="section-title">Quick quiz</h2>
        <p class="section-sub">Tap your answers, then get a pick.</p>
      </header>
      <div id="quiz-questions"><!-- rendered by script.js --></div>
      <div class="quiz-actions">
        <button id="btn-quiz-submit" class="btn btn--primary">Pick for me</button>
        <button id="btn-quiz-back" class="btn btn--ghost">← Back</button>
      </div>
    </section>

    <!-- =================================================================
         SECTION: RESULT
         ================================================================= -->
    <section id="section-result" class="section result">
      <header class="section-head">
        <h2 class="section-title">Your pick</h2>
      </header>
      <div id="result-card"><!-- rendered by script.js --></div>
      <div class="result-actions">
        <button id="btn-result-menu" class="btn btn--secondary">See full menu</button>
        <button id="btn-result-retry" class="btn btn--ghost">↺ Try again</button>
      </div>
    </section>

    <!-- =================================================================
         SECTION: MENU
         ================================================================= -->
    <section id="section-menu" class="section menu">
      <header class="section-head">
        <h2 class="section-title">Full menu</h2>
        <p class="section-sub">Everything we make, fresh to order.</p>
      </header>
      <div id="menu-list"><!-- rendered by script.js --></div>
      <div class="btn-row" style="margin-top:16px;">
        <button id="btn-menu-pick" class="btn btn--primary">Pick for me</button>
        <button id="btn-menu-back" class="btn btn--secondary">← Home</button>
      </div>
    </section>

  </main>

  <!-- data first, then logic -->
  <script src="data.js"></script>
  <script src="script.js"></script>
</body>
</html>
